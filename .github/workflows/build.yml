name: Build

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Adapted from Mattilsynet/rust-ci-conf/.github/workflows/upload.yaml.

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci-reusable.yml

  build:
    name: Build and push to GAR
    needs: ci
    runs-on: ubuntu-latest

    env:
      GAR_LOCATION: europe-north1
      ARTIFACT_ID: artifacts-352708
      IMAGE: europe-north1-docker.pkg.dev/artifacts-352708/${{ vars.ARTIFACT_REPO_ID }}/${{ github.event.repository.name }}

    permissions:
      contents: read
      id-token: write

    outputs:
      digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # MEDIUM-5 hardening (Layer 2): a release tag must point to a commit that
      # is an ancestor of main. Code cannot reach main without passing PR review
      # + CI (branch protection), so this blocks releasing a tag aimed at an
      # arbitrary non-main commit even if a tag slips past the Stabsec-only tag
      # ruleset. Deploy already `needs: build`, so a failure here gates deploy.
      - name: Verify release tag is an ancestor of main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::refusing to release: $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: auth-gar
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          create_credentials_file: true
          workload_identity_provider: projects/799884623953/locations/global/workloadIdentityPools/gh-actions/providers/github
          service_account: artifacts-wi-sa-github-actions@${{ env.ARTIFACT_ID }}.iam.gserviceaccount.com

      - name: Login to GAR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-gar.outputs.access_token }}

      - id: build-push
        name: Build and push docker image to GAR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: crates/gh-report/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=docker-build
          cache-to: type=gha,mode=max,scope=docker-build

      # The BOM below describes the digest that was just pushed: its OCI root
      # and the image scan bind to that digest, while the cargo graph is
      # resolved from the checked-out source at the release commit.
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          toolchain: 1.100.0

      - name: Install cargo-cyclonedx 0.5.7
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-cyclonedx@0.5.7
          fallback: none
          checksum: true

      - name: Test the release SBOM tools
        run: |
          set -euo pipefail
          python3 -B tools/test_sbom_merge.py
          python3 -B tools/test_dtrack_vex.py

      - name: Compute the shipped crate closure
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --filter-platform x86_64-unknown-linux-gnu --locked > "$RUNNER_TEMP/metadata.json"
          python3 -B tools/sbom_merge.py shipset --metadata "$RUNNER_TEMP/metadata.json" --root gh-report --out "$RUNNER_TEMP/shipset.txt"

      - name: Generate the cargo BOM
        run: |
          set -euo pipefail
          cargo cyclonedx -f json --spec-version 1.5 --override-filename bom --no-build-deps --target x86_64-unknown-linux-gnu
          test -s crates/gh-report/bom.json

      - name: Scan the pushed image digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build-push.outputs.digest }}
          registry-username: oauth2accesstoken
          registry-password: ${{ steps.auth-gar.outputs.access_token }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/image-bom.json
          syft-version: v1.54.0
          upload-artifact: false
          dependency-snapshot: false

      - name: Merge and check the release BOM
        run: |
          python3 -B tools/sbom_merge.py merge \
            --cargo-bom crates/gh-report/bom.json \
            --image-bom "$RUNNER_TEMP/image-bom.json" \
            --shipset "$RUNNER_TEMP/shipset.txt" \
            --repository-url "$IMAGE" \
            --digest "${{ steps.build-push.outputs.digest }}" \
            --tag "${{ github.ref_name }}" \
            --out "$RUNNER_TEMP/bom.json" \
            --check

      - name: Upload the release BOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/bom.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloud Run
    needs: [build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - id: auth-deploy
        name: Authenticate to Google Cloud (deploy)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/75951934649/locations/global/workloadIdentityPools/gh-actions/providers/github
          service_account: cloudrun-wi-sa-github-actions@ghreport-d302.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy to Cloud Run by digest (hard cutover)
        run: |
          gcloud run services update ghreport \
            --region europe-north1 \
            --project ghreport-d302 \
            --image "europe-north1-docker.pkg.dev/artifacts-352708/${{ vars.ARTIFACT_REPO_ID }}/${{ github.event.repository.name }}@${{ needs.build.outputs.digest }}" \
            --no-cpu-throttling \
            --startup-probe="initialDelaySeconds=30,timeoutSeconds=5,failureThreshold=30,periodSeconds=10,httpGet.path=/healthz,httpGet.port=8080"

      - name: Verify Cloud Run service readiness
        run: |
          READY=$(gcloud run services describe ghreport \
            --region europe-north1 \
            --project ghreport-d302 \
            --format=json | jq -r '.status.conditions[] | select(.type=="Ready") | .status')
          if [ "$READY" != "True" ]; then
            echo "::error::Cloud Run service ghreport is not in Ready state"
            exit 1
          fi

      # Delivery of the release BOM is owned here: only after readiness is the
      # running image confirmed, and the documented project identity is fixed.
      - name: Download the release BOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: ${{ runner.temp }}/sbom

      - name: Deliver the release BOM to Dependency-Track (delivery owner)
        uses: DependencyTrack/gh-upload-sbom@331f980a6eba119842052f447c54b09e4888b4c6 # v4.3.0
        with:
          server-hostname: api.dtrack.mattilsynet.io
          api-key: ${{ secrets.DTRACK_API_KEY }}
          project-name: gh-report
          project-version: prod
          # Team ownership marker: this is how the portfolio is read by owning
          # team. The upload binds the project's tag set to exactly this value.
          project-tags: infosec
          auto-create: true
          is-latest: true
          bom-filename: ${{ runner.temp }}/sbom/bom.json
