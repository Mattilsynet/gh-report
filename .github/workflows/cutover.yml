name: Cutover Traffic

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Cloud Run revision name to receive 100% traffic (e.g. ghreport-00102-xxx)"
        required: true
        type: string

jobs:
  cutover:
    name: Cutover Traffic
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - id: auth-deploy
        name: Authenticate to Google Cloud (deploy)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/75951934649/locations/global/workloadIdentityPools/gh-actions/providers/github
          service_account: cloudrun-wi-sa-github-actions@ghreport-d302.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Shift 100% Traffic to Revision
        run: |
          gcloud run services update-traffic ghreport \
            --region europe-north1 \
            --project ghreport-d302 \
            --to-revisions "${{ inputs.revision }}=100"
