# Schema v2 (cargo-deny >= 0.14): vulnerability / unsound / notice severity
# knobs were removed; all such advisories now emit errors unconditionally.
# Only `yanked` and `unmaintained` remain tunable. Defaults are already the
# strictest setting (unmaintained = "all"); listed explicitly so a future
# edit cannot relax the posture by accident. See AGENTS.md doctrine and
# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
unused-ignored-advisory = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "expires=2027-02-15 owner=@Mattilsynet/stabsec class=unmaintained -- compile-time-only proc-macro (paste 1.0.15), never reaches the shipped wasm bundle or server binary; sole path is Leptos macro machinery (chain verified 100% Leptos-family); no patched version; upstream archived 2024-10-06; exit trigger = Leptos drops paste (SEC-0013:R1)" },
    { id = "RUSTSEC-2026-0173", reason = "expires=2027-02-15 owner=@Mattilsynet/stabsec class=unmaintained -- consumed solely by proc-macro crates (leptos_macro, reactive_stores_macro, syn_derive) (proc-macro-error2 2.0.1); compile-time-only; chain verified; no patched version; upstream archived 2026-06-07; exit trigger = Leptos drops proc-macro-error2 (SEC-0013:R1)" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # BSL-1.0: xxhash-rust (transitive via zstd via cherry-pit-storage).
    # Boost Software License 1.0, OSI-approved, permissive — equivalent
    # in posture to MIT/BSD. Allowed for the same reason as ISC.
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `path = "../foo"` deps are wildcards by default
# because they carry no version constraint. We're an unpublished
# workspace; treat intra-workspace path deps as out of scope for the
# wildcard ban. External wildcards remain denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]
