{%- macro head(base, title, sortable, warm_start) -%}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ base }}style.css">
    <script src="{{ base }}ws.js" defer></script>
    {% if sortable %}<script type="module" src="{{ base }}sort-init.js"></script>{% endif %}
    {% if warm_start %}<meta http-equiv="refresh" content="5">{% endif %}
</head>
{%- endmacro -%}
