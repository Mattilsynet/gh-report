{%- macro head(base, title, sortable, warm_start) -%}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ base }}style.css">
    <link rel="icon" type="image/svg+xml" href="{{ base }}favicon.svg">
    <script src="{{ base }}ws.js" defer></script>
    {% if sortable %}<link rel="modulepreload" href="{{ base }}gh-report-web-client.js">
    <link rel="preload" href="{{ base }}gh-report-web-client_bg.wasm" as="fetch" crossorigin>
    <script type="module" src="{{ base }}sort-init.js"></script>{% endif %}
    {% if warm_start %}<meta http-equiv="refresh" content="5">{% endif %}
</head>
{%- endmacro -%}
