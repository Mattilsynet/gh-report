[package]
name = "domain-app-host"
version = "0.1.0"
description = "Production WASM host for the domain-app plugin boundary (CHE-0105/0106/0107, SEC-0013)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
wasmtime = { version = "47", default-features = false, features = ["component-model", "runtime", "cranelift"] }
wasmtime-wasi = "47.0.3"
wasmtime-wasi-io = "47.0.3"
thiserror = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
