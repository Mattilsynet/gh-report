[package]
name = "adr-srv"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[lints]
workspace = true

[dependencies]
# adr-fmt library surface (AFM-0026:R1), sourced from canonical
# upstream via the workspace-level rev-pinned git dep (RST-0004:R1).
adr-fmt = { workspace = true }

# Event-sourcing substrate (cherry-pit-core traits: DomainEvent,
# Projection, ReadPort). Persistence itself is native pardosa
# (CHE-0098 R8/R9 hard cut) — see NativeAdrStore in store.rs.
cherry-pit-core = { workspace = true }

# Wire substrate.
axum = { workspace = true }
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# Domain primitives.
jiff = { workspace = true }
xxhash-rust = { workspace = true }
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true }
thiserror = { workspace = true }
pardosa = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "adr-srv"
path = "src/main.rs"

[lib]
name = "adr_srv"
path = "src/lib.rs"
