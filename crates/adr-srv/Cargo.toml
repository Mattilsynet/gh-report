[package]
name = "adr-srv"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[lints]
workspace = true

[dependencies]
# adr-fmt library surface (AFM-0026:R1) — already wired in M1.1.
adr-fmt = { path = "../adr-fmt" }

# Event-sourcing substrate (cherry-pit-core traits: DomainEvent,
# Projection, ReadPort). Persistence itself is native pardosa
# (CHE-0098 R8/R9 hard cut) — see NativeAdrStore in store.rs.
cherry-pit-core = { workspace = true }

# Wire substrate.
axum = { workspace = true }
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }

# Domain primitives.
jiff = { workspace = true }
xxhash-rust = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# Native GenomeSafe event model (CHE-0098 N-R2/N-R3): schema-hashed
# durable payload. pardosa-wire is a direct dep (not just transitive
# via pardosa-schema) because pardosa-derive's GenomeSafe macro
# resolves Encode/Decode paths via `pardosa` (the store facade) or
# `pardosa-wire` directly.
pardosa-schema = { path = "../pardosa-schema", version = "=0.1.0" }
pardosa-wire = { path = "../pardosa-wire", version = "=0.1.0" }
thiserror = { workspace = true }

# Native pardosa store port (CHE-0098 N-R1/N-R4/N-R5): production
# persistence facade + one-fiber-per-key adapter. NOT
# cherry-pit-pardosa (N-R1 forbids that dep for production
# persistence).
pardosa = { path = "../pardosa", version = "=0.4.0" }
pardosa-fiber-store = { path = "../pardosa-fiber-store", version = "=0.1.0" }

[dev-dependencies]
tempfile = { workspace = true }
tower = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "adr-srv"
path = "src/main.rs"

[lib]
name = "adr_srv"
path = "src/lib.rs"
