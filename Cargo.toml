[workspace]
resolver = "3"
members = [
    "crates/gh-report",
    "crates/gh-report-web-client",
    "crates/non-exhaustive-check",
]

# gh-report-web-client is wasm32-only (Leptos CSR, CHE-0087 R6): excluded
# from the default build set so a bare `cargo build` / `cargo test` never
# drives the wasm crate on the host toolchain. It builds under an explicit
# `--target wasm32-unknown-unknown` (or `-p gh-report-web-client`) only.
default-members = [
    "crates/gh-report",
    "crates/non-exhaustive-check",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/Mattilsynet/gh-report"
repository = "https://github.com/Mattilsynet/gh-report"
authors = ["Mattilsynet"]

[workspace.dependencies]
# === Text processing ===
regex = "1"
toml = "1"

# === Serialization ===
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rmp-serde = "1"

# === Identity / time ===
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "0.2", features = ["serde"] }
# GEN-0041 foreign floor: capacity-bounded inline vec. default-features off
# keeps it `no_std`-clean for pardosa-encoding's `#![no_std]` substrate.
arrayvec = { version = "0.7", default-features = false }

# === Async / concurrency ===
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
scc = "3"
futures-util = "0.3"

# === Web framework ===
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "ws"] }
tower-http = { version = "0.7", features = ["limit", "trace"] }

# === Networking / HTTP ===
bytes = "1"
http = "1"
httpdate = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "gzip"] }

# === Crypto / encoding ===
sha2 = "0.11"
zstd = { version = "0.14", default-features = false }
# GEN-0041 no_std floor: BLAKE3 with default-features off keeps it
# `no_std`-clean for pardosa-encoding's `#![no_std]` substrate. PAR-0021 R1
# precursor-hash identity.
blake3 = { version = "1.8.7", default-features = false }

# === Concurrency ===
arc-swap = { version = "1", default-features = false }

# === Logging ===
tracing = "0.1"

# === Error handling ===
thiserror = "2"

# === Benchmarking ===
# criterion 0.8 statistical bench harness. dev-dependency only;
# pardosa-encoding stays no_std (lib build does not pull criterion).
# default-features off keeps the dep surface minimal (no html_reports;
# downstream crates can opt in via `features = ["html_reports"]` if
# needed for a specific bench). Bumped from 0.5 to 0.8 to match the
# rescue-pardosa workspace tier when the Pardosa crates were imported
# (mission pardosa-migration-1748376000).
criterion = { version = "0.8", default-features = false }

# === Misc ===
fastrand = "2"
gethostname = "1"
rustix = { version = "1.1.4", default-features = false, features = ["process", "std"] }

# === CLI ===
# clap routed at workspace tier with `derive` only; gh-report adds `env` via
# `features = ["env"]` on its dep entry. F6 default-features tightening deferred:
# disabling defaults removes std/color/help/usage/error-context/suggestions,
# which would alter CLI UX; defer F6 until post-MC-P0.
clap = { version = "4", features = ["derive"] }
# ron: RON (Rusty Object Notation) render for pardosa-read's agent-facing
# CLI output (mission pardosa-read-cli-1752739200). default-features per
# RST-0004 (no non-default features needed for ser::to_string_pretty).
ron = "0.12"

# === Internal ===
cherry-pit-core = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.1.0" }
cherry-pit-gateway = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.1.0" }
cherry-pit-projection = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.1.0" }
cherry-pit-web = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.1.0" }
cherry-pit-app = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.1.0" }
cherry-pit-merger = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.1.0" }
cherry-pit-wq = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.2.0" }
cherry-pit-storage = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.1.0" }
pardosa-cherry-pit-test-support = { git = "https://github.com/acje/cherry-pit", rev = "1ecc7b118bf5bf2ccb75c8d6a992fb65351d735e", version = "0.0.0" }
pardosa = { git = "https://github.com/acje/pardosa", rev = "66da6bd3e83a322f298018975dde27d7131ba48d", version = "0.5.5" }
pardosa-nats = { git = "https://github.com/acje/pardosa", rev = "66da6bd3e83a322f298018975dde27d7131ba48d", version = "0.5.5" }

# === Pardosa workspace tier (mission pardosa-migration-1748376000) ===
# Added when the active Pardosa crates were imported from rescue-pardosa.
# proc-macro-crate is consumed by pardosa-derive to discover the
# pardosa-genome / pardosa-traits crate names at macro-expansion time
# (PAR-0027:R1 fully-qualified-path emission). syn/quote/proc-macro2 are
# the standard proc-macro tooling tier. async-nats is the JetStream
# authoritative-storage substrate for pardosa-nats (ADR-0022 §D10).
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
async-nats = { version = "0.49", default-features = false, features = ["server_2_14", "jetstream", "ring", "nkeys"] }

# === Async runtime extras ===
tokio-util = { version = "0.7", default-features = false }

# === Templating ===
askama = "0.16.1"

# === Logging extras ===
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# === Crypto / auth ===
# hmac: constant-time HMAC-SHA256 webhook signature verification.
hmac = "0.13"
# jsonwebtoken: GitHub App auth; aws_lc_rs backend (FIPS-validated, ring successor).
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
# pem: RSA key parsing for defence-in-depth key-size validation.
pem = "4"
# secrecy: SecretString auto-zeroize on drop.
secrecy = { version = "0.10", features = ["serde"] }
# zeroize: explicit zeroize of intermediate token buffers.
zeroize = "1"
# base64: encoding.
base64 = "0.23"

# === URL handling ===
url = "2"

# === Caching ===
moka = { version = "0.12", features = ["future"] }

# === WASM client (item12-leptos-sort; CHE-0087) ===
# csr only, no nightly feature (MSRV-verified bd-ghr-16858874: leptos 0.8.20
# rust-version 1.88 < workspace 1.98 pin). wasm-bindgen pinned EXACTLY: the
# installed wasm-bindgen-cli must match this version bit-for-bit.
leptos = { version = "0.8.20", default-features = false, features = ["csr"] }
wasm-bindgen = "=0.2.128"
web-sys = { version = "0.3.105", default-features = false, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCollection",
    "HtmlElement",
    "HtmlTableElement",
    "HtmlTableRowElement",
    "HtmlTableSectionElement",
    "Node",
    "NodeList",
    "Window",
] }
js-sys = { version = "0.3.105", default-features = false }

# === Dev dependencies ===
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"
trybuild = "1"
tokio-tungstenite = "0.30"
tokio-test = "0.4"
wiremock = "0.6"
insta = { version = "1", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
lto = true
strip = true
codegen-units = 1
overflow-checks = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
as_underscore = "warn"
as_pointer_underscore = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
enum_glob_use = "warn"
fallible_impl_from = "warn"
fn_to_numeric_cast_any = "warn"
inefficient_to_string = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_include_file = "warn"
literal_string_with_formatting_args = "warn"
manual_clamp = "warn"
manual_instant_elapsed = "warn"
manual_is_ascii_check = "warn"
manual_let_else = "warn"
manual_pattern_char_comparison = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_wild_err_arm = "warn"
mixed_read_write_in_expression = "warn"
mut_mut = "warn"
mutex_atomic = "warn"
needless_collect = "warn"
needless_pass_by_ref_mut = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_clone = "warn"
redundant_else = "warn"
rest_pat_in_fully_bound_structs = "warn"
search_is_some = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
todo = "warn"
trailing_empty_array = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unneeded_field_pattern = "warn"
unnecessary_join = "warn"
unnecessary_self_imports = "warn"
unnecessary_wraps = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
wildcard_enum_match_arm = "warn"
zero_sized_map_values = "warn"
